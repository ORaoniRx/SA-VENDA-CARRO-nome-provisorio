<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoDrive - Carros Usados e Seminovos</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- NAVBAR -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <!-- INICIO -->
                <div class="flex items-center">
                    <a href="#" class="flex items-center space-x-2 text-2xl font-bold text-emerald-500 tracking-tight">
                        <i class="fa-solid fa-car-side"></i>
                        <span>Auto<span class="text-gray-900">Drive</span></span>
                    </a>
                </div>

                <!-- LOGIN -->
                <div class="hidden md:flex items-center space-x-8">
                    <a href="#comprar" class="text-gray-600 hover:text-emerald-600 font-medium transition duration-200">Comprar</a>
                    <a href="#vender" class="text-gray-600 hover:text-emerald-600 font-medium transition duration-200">Vender</a>
                    <a href="#login" class="bg-emerald-500 text-white px-5 py-2 rounded-lg font-medium hover:bg-emerald-700 transition duration-200 shadow-sm">
                        <i class="fa-regular fa-user mr-2"></i>Login
                    </a>
                </div>

                <!-- MENU-MOBILE -->
                <div class="flex items-center md:hidden">
                    <button id="mobile-menu-btn" class="text-gray-600 hover:text-gray-900 focus:outline-none">
                        <i class="fa-solid fa-bars text-2xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-gray-100 px-4 pt-2 pb-4 space-y-3 shadow-lg">
            <a href="#comprar" class="block text-gray-600 hover:text-emerald-600 font-medium py-2">Comprar</a>
            <a href="#vender" class="block text-gray-600 hover:text-emerald-600 font-medium py-2">Vender</a>
            <a href="#login" class="block bg-emerald-600 text-white text-center px-4 py-2 rounded-lg font-medium hover:bg-emerald-700">
                <i class="fa-regular fa-user mr-2"></i>Login
            </a>
        </div>
    </nav>

    <!-- CONTEUDO-PRINCIPAL -->
    <main class="flex-grow flex items-center justify-center relative bg-cover bg-center py-20 px-4" 
          style="background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1549399542-7e3f8b79c341?auto=format&fit=crop&q=80&w=1920');">
        
        
        <div class="max-w-4xl w-full text-center text-white space-y-8">
            <div class="space-y-3">
                <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight drop-shadow-md">
                    Encontre o seu próximo carro
                </h1>
                <p class="text-lg md:text-xl text-gray-200 max-w-2xl mx-auto drop-shadow-sm">
                    Milhares de opções de usados e seminovos em um só lugar.
                </p>
            </div>

            <div class="bg-white p-4 md:p-6 rounded-2xl shadow-2xl text-gray-900 max-w-3xl mx-auto">
                <form action="#" method="GET" class="space-y-4 md:space-y-0 md:flex md:items-center md:space-x-3">
                    
                    <div class="flex-grow relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400"></i>
                        <input type="text" 
                               placeholder="Digite marca, modelo ou ano... (ex: Honda Civic)" 
                               class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition duration-200 text-base">
                    </div>

                    <button type="submit" class="w-full md:w-auto bg-emerald-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-emerald-700 transition duration-200 flex items-center justify-center space-x-2 shadow-md">
                        <span>Buscar</span>
                        <i class="fa-solid fa-arrow-right text-sm"></i>
                    </button>
                </form>

                <div class="flex flex-wrap justify-center gap-2 mt-4 text-xs font-semibold text-gray-500">
                    <span class="text-gray-400 font-normal">Mais buscados:</span>
                    <a href="#" class="bg-gray-100 hover:bg-gray-200 px-2.5 py-1 rounded-full transition">SUV</a>
                    <a href="#" class="bg-gray-100 hover:bg-gray-200 px-2.5 py-1 rounded-full transition">Automático</a>
                    <a href="#" class="bg-gray-100 hover:bg-gray-200 px-2.5 py-1 rounded-full transition">Até R$ 50.000</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-900 text-gray-400 text-center py-6 text-sm border-t border-gray-800">
        <p>&copy; 2026 AutoDrive. Trabalho de Escola.</p>
    </footer>

    <script>
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');

        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
        });
    </script>
</body>
</html>
